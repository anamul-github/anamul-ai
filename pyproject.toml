[project]
name = "anamul-ai"
version = "0.1.0"
description = "A chatbot that answers questions about Anamul Hasan, with sources."
readme = "README.md"
authors = [
    { name = "Anamul Hasan", email = "anamul.jobhunt@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.6.0",
    "fastapi[standard]>=0.162.0",
    "httpx>=0.28.1",
    "mangum>=0.22.0",
    "markdownify>=1.2.3",
    "pydantic-settings>=2.16.2",
    "pypdf>=6.21.4",
    "voyageai>=0.5.0",
]

[project.scripts]
anamul-ai = "anamul_ai:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
